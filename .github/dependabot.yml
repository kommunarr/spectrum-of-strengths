version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    # Major upgrades need coordinated compatibility work; security updates
    # remain independent of this version-update filter.
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    ignore:
      # The 0.5 series requires ESLint 9 and the site still uses ESLint 8.
      - dependency-name: eslint-plugin-react-refresh
        versions:
          - ">=0.5.0"
    groups:
      routine-npm-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      routine-action-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
